<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meme Sprint 3 — All Clean!</title>
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; background: #FFD93D; overflow: hidden; }
  svg { display: block; width: 1024px; height: 1024px; }
  .meme-text {
    font-family: "DejaVu Sans", Arial, sans-serif;
    font-weight: 900;
    font-size: 62px;
    fill: #FFFFFF;
    stroke: #111111;
    stroke-width: 9px;
    stroke-linejoin: round;
    paint-order: stroke;
    text-anchor: middle;
    letter-spacing: 1px;
  }
  .bubble-text {
    font-family: "DejaVu Sans", Arial, sans-serif;
    font-weight: 900;
    font-size: 46px;
    fill: #111111;
    text-anchor: middle;
  }
  .label-text {

    fill: #5C3D00;

</style>
</head>
